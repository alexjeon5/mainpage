<body data-page="main">
  <header class="site-header is-sticky" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"></span>HANGGOK</a>
      <nav id="site-nav" class="nav" aria-label="주요 메뉴">
        <a href="#live" data-i18n="nav.live">Live</a><a href="#lab" data-i18n="nav.lab">Lab</a><a href="#work" data-i18n="nav.work">Work</a><a href="#log" data-i18n="nav.log">Log</a><a href="#contact" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="header-actions">
        <div class="lang-switch">
          <button id="lang-toggle" class="lang-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-menu"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"/></svg><span id="lang-current">KO</span></button>
          <ul id="lang-menu" class="lang-menu" role="listbox" aria-label="Language" hidden>
            <li role="option" data-lang="ko" tabindex="-1">한국어</li>
            <li role="option" data-lang="en" tabindex="-1">English</li>
          </ul>
        </div>
        <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-pressed="false" aria-label="다크 모드로 전환">
          <span class="theme-icon theme-icon--sun" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></span>
          <span class="theme-icon theme-icon--moon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></span>
        </button>
      </div>
      <button id="nav-toggle" class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="메뉴 열기"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <main id="top" class="container">
    <section aria-label="소개" class="hero">
      <div id="hero-term" class="term" data-state="typing"></div>
    </section>
    <div id="stats" role="list"></div>
    <section id="live" class="home-section">
      <div class="sec-head">
        <div class="sec-head-main"><span class="sec-kicker" data-i18n="live.kicker"></span><h2 class="sec-title" data-i18n="live.title"></h2></div>
        <p class="sec-desc" data-i18n="live.desc"></p>
      </div>
      <div class="live-block"><ul id="live-list"></ul></div>
    </section>
    <section id="lab" class="home-section">
      <div class="sec-head">
        <div class="sec-head-main"><span class="sec-kicker" data-i18n="lab.kicker"></span><h2 class="sec-title" data-i18n="lab.title"></h2></div>
        <p class="sec-desc" data-i18n="lab.desc"></p>
      </div>
      <div id="lab-servers"></div>
    </section>
    <section id="work" class="home-section">
      <div class="sec-head">
        <div class="sec-head-main"><span class="sec-kicker" data-i18n="work.kicker"></span><h2 class="sec-title" data-i18n="work.title"></h2></div>
      </div>
      <div id="work-list"></div>
      <div class="versions"><h3 class="versions-heading" data-i18n="work.versions"></h3><ol id="versions-list"></ol></div>
    </section>
    <section id="log" class="home-section">
      <div class="sec-head">
        <div class="sec-head-main"><span class="sec-kicker" data-i18n="log.kicker"></span><h2 class="sec-title" data-i18n="log.title"></h2></div>
      </div>
      <div class="log-grid"><aside class="log-plans"><span class="log-next-label" data-i18n="log.next">NEXT</span><ul id="log-next"></ul></aside><ol id="log-list"></ol></div>
    </section>
    <section id="contact">
      <div class="contact-copy"><span class="contact-kicker" data-i18n="contact.kicker">05 — Contact</span><h2 data-i18n="contact.title">같이 만들어요.</h2><p data-i18n="contact.desc"></p></div>
      <div class="contact-actions"><a class="contact-cta" href="https://www.instagram.com/hs1xh_k/" target="_blank" rel="noopener" data-i18n="contact.cta">Instagram DM →</a><div class="contact-socials"><a href="https://github.com/alexjeon5" target="_blank" rel="noopener" data-i18n="contact.github">GitHub</a><a href="https://www.youtube.com/@HANGGOK" target="_blank" rel="noopener" data-i18n="contact.youtube">YouTube</a></div></div>
    </section>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><span data-i18n="footer.copyright">© 2026 HANGGOK</span><a href="https://github.com/alexjeon5/mainpage/" target="_blank" rel="noopener" data-i18n="footer.source">Source on GitHub ↗</a></div></footer>
  <!-- 모달 -->
  <div id="srv-error-overlay" class="modal-overlay"></div>
  <div id="srv-error" class="modal-window" role="dialog" aria-modal="true">
    <h2 data-i18n="modal.notice">알림</h2>
    <p data-i18n="modal.notice_desc">현재 서비스를 준비하고 있습니다.<br>조금만 기다려주세요!</p>
    <button id="srv-error-close-btn" class="btn" data-i18n="modal.confirm">확인</button>
  </div>

  <div id="portfolio-detail" class="pd-overlay" role="dialog" aria-modal="true" tabindex="-1"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
