<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t;try{t=localStorage.getItem('hanggok-theme')}catch(e){}if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4F2EE">
  <link rel="icon" href="../assets/img/icon.png" type="image/png">
  <title>HANGGOK — 킹받는 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..112,700..900&family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..112,700..900&family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script crossorigin src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="calc.css">
</head>
<body data-page="calc">
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="../"><span class="brand-mark" aria-hidden="true"></span>HANGGOK<span class="brand-sub">/ calc</span></a>
      <div class="header-actions">
        <a class="back-link" href="../">← 메인으로</a>
        <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-pressed="false" aria-label="다크 모드로 전환">
          <span class="theme-icon theme-icon--sun" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
          <span class="theme-icon theme-icon--moon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></span>
        </button>
      </div>
    </div>
  </header>

  <main class="container calc-main">
    <div class="calc-intro">
      <span class="sec-kicker">Web App</span>
      <h1 class="calc-title">킹받는 계산기</h1>
      <p class="calc-desc">생각하는 계산기를 만나보세요.</p>
    </div>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled value="0">
        
        <div class="keys">
            <button class="calc-btn clear" onclick="clearDisplay()">C</button>
            <button class="calc-btn operator" onclick="appendOperator('/')" aria-label="나누기">÷</button>
            <button class="calc-btn operator" onclick="appendOperator('*')" aria-label="곱하기">×</button>
            <button class="calc-btn" onclick="appendNumber('7')">7</button>
            <button class="calc-btn" onclick="appendNumber('8')">8</button>
            <button class="calc-btn" onclick="appendNumber('9')">9</button>
            <button class="calc-btn operator" onclick="appendOperator('-')" aria-label="빼기">−</button>
            <button class="calc-btn" onclick="appendNumber('4')">4</button>
            <button class="calc-btn" onclick="appendNumber('5')">5</button>
            <button class="calc-btn" onclick="appendNumber('6')">6</button>
            <button class="calc-btn operator" onclick="appendOperator('+')" aria-label="더하기">+</button>
            <button class="calc-btn" onclick="appendNumber('1')">1</button>
            <button class="calc-btn" onclick="appendNumber('2')">2</button>
            <button class="calc-btn" onclick="appendNumber('3')">3</button>
            <button class="calc-btn equals" style="grid-row: span 2;" onclick="calculate()">=</button>
            <button class="calc-btn zero" onclick="appendNumber('0')">0</button>
            <button class="calc-btn" onclick="appendNumber('.')">.</button>
        </div>
    </div>

  </main>

    <div id="thinking-overlay" class="modal-overlay"></div>
    <div id="thinking-modal" class="modal-window">
        <h2><i class="fa-solid fa-spinner fa-spin" style="color: var(--accent-text);"></i> Thinking...</h2>
        <p>수식을 처리하고 있습니다.<br>잠시만 기다려 주세요.</p>
    </div>

    <div id="payment-overlay" class="modal-overlay"></div>
    <div id="payment-modal" class="modal-window">
        <h2><i class="fa-solid fa-gem" style="color: var(--accent-text);"></i> 1회 계산 결제</h2>
        <p style="margin-top: 0;">계산기 무료 이용 횟수가 만료되었습니다.<br>추가 계산 시 1회당 결제가 필요합니다.</p>
        
        <button class="apple-pay-btn" id="apple-pay-btn" onclick="processApplePay()" style="display: none;">
            <img src="Apple_Pay_Mark_RGB_041619.svg" alt="Apple Pay" class="apple-pay-logo">
        </button>

        <div class="divider" id="apple-pay-divider" style="display: none;"><span>또는 신용카드 결제</span></div>

        <div class="payment-form">
            <div class="input-group">
                <label>카드 번호</label>
                <div class="card-input-wrapper">
                    <i class="fa-solid fa-credit-card card-logo-icon" id="card-brand-icon"></i>
                    <input type="tel" id="card-number" placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
            </div>
            <div class="row-inputs">
                <div class="input-group">
                    <label>유효기간 (MM/YY)</label>
                    <input type="tel" id="card-expiry" placeholder="MM/YY" maxlength="5">
                </div>
                <div class="input-group">
                    <label>CVC</label>
                    <input type="password" id="card-cvc" placeholder="***" maxlength="3">
                </div>
            </div>
            <div class="input-group">
                <label>비밀번호 앞 2자리</label>
                <input type="password" id="card-pwd" placeholder="**" maxlength="2">
            </div>
        </div>

        <div class="modal-buttons">
            <button class="btn btn-secondary" onclick="closePaymentModal()">취소</button>
            <button class="btn btn-primary" id="pay-submit-btn" onclick="processCardPayment()">결제하기</button>
        </div>
    </div>

    <script type="module">
      import { Theme } from '../assets/js/modules/theme.js';
      import { initHeader } from '../assets/js/modules/header.js';
      new Theme().bind();
      initHeader();
    </script>
    <script src="calc.js"></script>
</body>
</html>
